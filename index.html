<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.gstatic.com/firebasejs/; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://script.google.com https://*.googleusercontent.com https://www.google.com/recaptcha/ https://*.firebaseio.com https://*.googleapis.com; img-src 'self' data: blob: https://quickchart.io ./logo-poltera.png; frame-src 'self' https://www.google.com/recaptcha/;">
  <title>SIPARTA v8 (Firebase Staging)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- FIREBASE SDK COMPAT (Jembatan ke Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    .hide { display: none !important; }
  </style>
  <script>tailwind.config = { theme: { extend: { colors: { 'poltera-navy': '#1e3a8a', 'poltera-accent': '#f59e0b', 'poltera-dark': '#0f172a' } } } }</script>
</head>
<body class="text-slate-800">

  <!-- ==================== UI LOGIN ==================== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-poltera-dark via-slate-800 to-poltera-navy p-4">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-30"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-poltera-accent rounded-full mix-blend-multiply filter blur-[100px] opacity-20"></div>

    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center relative z-10">
      <div class="mb-8">
        <center><div class="w-20 h-20 items-center justify-center"><img src="./logo-poltera.png" alt="Logo Poltera" class="w-15 h-15 object-contain"></div></center>
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight uppercase">SIPARTA v8</h1>
        <p class="text-xs font-semibold text-slate-400 mt-1 uppercase tracking-wider">Firebase Staging Area</p>
      </div>

      <div id="role-selection-section" class="space-y-3.5">
        <button onclick="bukaFormKredensial('mahasiswa')" class="w-full flex items-center gap-3.5 p-4 bg-slate-50 hover:bg-blue-50/80 border rounded-xl text-left transition"><div class="w-10 h-10 rounded-lg bg-blue-100 text-poltera-navy flex items-center justify-center text-lg"><i class="fas fa-user-graduate"></i></div><div><p class="font-bold text-sm text-slate-700">Mahasiswa</p><p class="text-[10px] text-slate-400">Masuk ke Dashboard Pribadi</p></div></button>
        <button onclick="bukaFormKredensial('admin')" class="w-full flex items-center gap-3.5 p-4 bg-slate-50 hover:bg-emerald-50 border rounded-xl text-left transition"><div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg"><i class="fas fa-user-shield"></i></div><div><p class="font-bold text-sm text-slate-700">Admin Akademik</p><p class="text-[10px] text-slate-400">Verifikator & TTE</p></div></button>
      </div>

      <div id="credential-form-section" class="hide space-y-4 text-left border p-5 rounded-2xl bg-slate-50/50">
        <button onclick="kembaliKePilihanRole()" class="text-slate-400 hover:text-poltera-navy mb-2"><i class="fas fa-arrow-left"></i> <span class="text-xs font-bold uppercase ml-1">Kembali</span></button>
        <form id="login-auth-form" onsubmit="prosesVerifikasiKredensial(event)">
          <div class="space-y-1 mb-3">
            <label class="block text-[11px] font-bold text-slate-500 uppercase" id="label-field-username">NRP / Username</label>
            <div class="relative"><span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-user text-xs"></i></span><input type="text" id="auth-username" required placeholder="Masukkan ID..." oninput="validasiInput(this)" class="w-full pl-9 pr-4 py-2.5 border rounded-lg text-xs font-semibold"></div>
          </div>
          <div class="space-y-1 mb-4" id="password-field-container">
            <label class="block text-[11px] font-bold text-slate-500 uppercase">Kata Sandi (Password)</label>
            <div class="relative"><span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-lock text-xs"></i></span><input type="password" id="auth-password" required class="w-full pl-9 pr-4 py-2.5 border rounded-lg text-xs font-semibold"></div>
          </div>
          <button type="submit" class="w-full bg-emerald-600 text-white text-xs font-bold py-3 rounded-xl shadow-md"><i class="fas fa-bolt mr-2"></i> Login via Firebase</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== DASHBOARD & SIDEBAR ==================== -->
  <div id="app-screen" class="hide flex h-screen overflow-hidden relative">
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden transition-opacity opacity-0 backdrop-blur-sm"></div>
    <aside id="main-sidebar" class="w-64 bg-poltera-dark text-slate-200 flex flex-col z-50 shadow-2xl absolute md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
      <button onclick="toggleSidebar()" class="md:hidden absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center"><i class="fas fa-times"></i></button>
      <div class="h-16 flex items-center justify-center gap-3 border-b border-slate-800 bg-slate-900/50"><img src="./logo-poltera.png" alt="Logo Poltera" class="w-9 h-9 object-contain drop-shadow-md"><span class="font-extrabold text-white tracking-widest uppercase text-lg">SIPARTA</span></div>
      <div class="p-4 border-b border-slate-800 bg-slate-950/40 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold" id="nav-initial">U</div><div class="overflow-hidden"><p class="text-xs font-bold text-white truncate" id="nav-user-name">User Name</p><p class="text-[9px] text-slate-400 uppercase tracking-widest font-semibold" id="nav-user-role">Role</p></div></div>
      <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto" id="nav-menu"></nav>
      <div class="p-4 border-t border-slate-800"><button onclick="handleLogout()" class="w-full py-2.5 bg-red-600/10 hover:bg-red-600 text-red-400 hover:text-white rounded-xl text-xs font-bold transition flex justify-center gap-2 items-center"><i class="fas fa-sign-out-alt"></i> Keluar Aplikasi</button></div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden w-full relative">
      <header class="bg-white border-b px-4 md:px-6 py-4 flex justify-between items-center z-10 shadow-sm">
        <div class="flex items-center gap-3"><button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-poltera-navy w-10 h-10 rounded-xl bg-slate-50 border flex items-center justify-center"><i class="fas fa-bars text-lg"></i></button><div><h3 class="text-base md:text-lg font-bold text-slate-800" id="header-title">Dashboard</h3><p class="text-[10px] md:text-xs text-emerald-500 font-bold hidden sm:block"><i class="fas fa-bolt"></i> Firebase Connected</p></div></div>
        <div class="flex items-center gap-3"><span class="text-[10px] md:text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg" id="header-date">Tanggal</span></div>
      </header>
      <div class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50" id="view-wrapper"></div>
    </main>
  </div>

  <!-- VIEWS DASHBOARD (Sama seperti sebelumnya) -->
  <template id="view-dashboard">
    <div class="space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-blue-50 text-poltera-navy flex items-center justify-center text-lg"><i class="fas fa-file-invoice"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Total Pengajuan</p><p class="text-xl font-bold text-slate-800" id="stat-total">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fas fa-spinner fa-spin"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Menunggu Verif</p><p class="text-xl font-bold text-slate-800" id="stat-pending">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fas fa-check-circle"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Disetujui</p><p class="text-xl font-bold text-slate-800" id="stat-done">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fas fa-times-circle"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Ditolak</p><p class="text-xl font-bold text-slate-800" id="stat-reject">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4" id="card-quota" style="display: none;"><div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg"><i class="fas fa-server"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Status Server</p><p class="text-sm font-bold text-slate-800 mt-1" id="stat-quota">Firebase</p></div></div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
        <div onclick="ajukanSuratSpesifik('1')" class="p-5 bg-white rounded-2xl border shadow-sm border-l-4 border-l-blue-500 hover:shadow-md transition cursor-pointer group"><h5 class="font-extrabold text-slate-800 text-sm mb-2 group-hover:text-poltera-navy transition"><i class="fas fa-file-alt text-blue-500 mr-1.5"></i> Surat Keterangan Aktif</h5><p class="text-[11px] text-slate-500 leading-relaxed">Klik untuk mengajukan.</p></div>
        <div onclick="ajukanSuratSpesifik('2')" class="p-5 bg-white rounded-2xl border shadow-sm border-l-4 border-l-emerald-500 hover:shadow-md transition cursor-pointer group"><h5 class="font-extrabold text-slate-800 text-sm mb-2 group-hover:text-poltera-navy transition"><i class="fas fa-file-signature text-emerald-500 mr-1.5"></i> Surat Keterangan</h5><p class="text-[11px] text-slate-500 leading-relaxed">Klik untuk mengajukan.</p></div>
        <div onclick="ajukanSuratSpesifik('3')" class="p-5 bg-white rounded-2xl border shadow-sm border-l-4 border-l-amber-500 hover:shadow-md transition cursor-pointer group"><h5 class="font-extrabold text-slate-800 text-sm mb-2 group-hover:text-poltera-navy transition"><i class="fas fa-briefcase text-amber-500 mr-1.5"></i> Surat Pengantar OJT</h5><p class="text-[11px] text-slate-500 leading-relaxed">Klik untuk mengajukan.</p></div>
      </div>
    </div>
  </template>

  <!-- FITUR: DAFTAR ANTREAN (Hybrid: Masih pakai GAS untuk menampilkan data lama) -->
  <template id="view-riwayat">
    <div class="bg-white rounded-2xl border shadow-sm flex flex-col h-full max-h-[85vh]">
      <div class="p-4 border-b flex flex-col md:flex-row justify-between items-center bg-slate-50 gap-3">
        <h4 class="font-bold text-sm shrink-0">Daftar Antrean Surat (GAS Engine)</h4>
      </div>
      <div class="overflow-x-auto flex-1 p-8 text-center text-slate-500">
         <i class="fas fa-tools text-4xl text-slate-300 mb-3"></i>
         <p>Fase 1: Uji Coba Login Firebase Selesai.</p>
         <p class="text-xs mt-2">Daftar tabel antrean akan dihubungkan ke Firestore pada Fase 2.</p>
      </div>
    </div>
  </template>

  <!-- TOAST NOTIFICATION -->
  <div id="app-toast" class="fixed bottom-5 right-5 left-5 md:left-auto bg-white border-l-4 border-slate-900 shadow-2xl rounded-xl px-5 py-4 hide flex items-center gap-3.5 z-50 transition-all"><div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm shrink-0" id="toast-icon-box"></div><div><h5 class="font-bold text-xs" id="toast-title">Notifikasi</h5><p class="text-[10px] text-slate-500" id="toast-desc">Memproses...</p></div></div>

  <script>
    // -------------------------------------------------------------
    // INISIALISASI FIREBASE (Konfigurasi Anda)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBLMONLXydW3nqBKnbVh7y6IoeeCXkMveA",
      authDomain: "siparta-poltera.firebaseapp.com",
      projectId: "siparta-poltera",
      storageBucket: "siparta-poltera.firebasestorage.app",
      messagingSenderId: "1019784565445",
      appId: "1:1019784565445:web:4d01687606461ef0e456ac",
      measurementId: "G-5R258DP34L"
    };
    
    // Mulai Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // -------------------------------------------------------------

    let appState = { role: null, user: null, currentView: 'dashboard', selectedMhs: null, pendingSuratCode: null };
    
    function validasiInput(input) { if (selectedAuthRole === 'mahasiswa') input.value = input.value.replace(/[^0-9]/g, ''); }
    function toggleSidebar() { const sidebar = document.getElementById('main-sidebar'); const overlay = document.getElementById('sidebar-overlay'); if (sidebar.classList.contains('-translate-x-full')) { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); setTimeout(() => overlay.classList.remove('opacity-0'), 10); } else { sidebar.classList.add('-translate-x-full'); overlay.classList.add('opacity-0'); setTimeout(() => overlay.classList.add('hidden'), 300); } }

    window.onload = function() {
      document.getElementById('header-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const savedUser = localStorage.getItem('esurat_fb_user'); const savedRole = localStorage.getItem('esurat_fb_role');
      if(savedUser && savedRole) { 
          appState.user = JSON.parse(savedUser); appState.role = savedRole; 
          const savedMhs = localStorage.getItem('esurat_fb_mhs'); if(savedMhs) appState.selectedMhs = JSON.parse(savedMhs); 
          document.getElementById('role-selection-section').classList.add('hide'); masukKeSistem(true); 
      }
    };

    let selectedAuthRole = '';
    function bukaFormKredensial(role) {
      selectedAuthRole = role; document.getElementById('role-selection-section').classList.add('hide'); document.getElementById('credential-form-section').classList.remove('hide');
      const label = document.getElementById('label-field-username'); const input = document.getElementById('auth-username'); const passInput = document.getElementById('auth-password');
      if (role === 'mahasiswa') { label.innerText = "NRP Anda"; input.placeholder = "Contoh: 331120000"; passInput.placeholder = "Password NRP"; } 
      else { label.innerText = "Username Admin"; input.placeholder = "admin"; passInput.placeholder = "Password Admin"; }
    }
    function kembaliKePilihanRole() { document.getElementById('credential-form-section').classList.add('hide'); document.getElementById('role-selection-section').classList.remove('hide'); }

    // =========================================================================
    // FUNGSI LOGIN BARU: MURNI MENGGUNAKAN FIREBASE FIRESTORE (Super Cepat!)
    // =========================================================================
    async function prosesVerifikasiKredensial(event) {
      event.preventDefault(); 
      const userVal = document.getElementById('auth-username').value.trim(); 
      const passVal = document.getElementById('auth-password').value; 
      showToast("Memeriksa Database...", "Menghubungkan ke Firestore", "fa-spinner fa-spin");

      try {
        let docRef;
        if (selectedAuthRole === 'admin') {
            docRef = db.collection('users').doc('admin_baak');
        } else {
            docRef = db.collection('users').doc(userVal);
        }

        // Ambil data langsung dari Firestore
        const doc = await docRef.get();

        if (doc.exists) {
            const data = doc.data();
            
            // Cek Password & Role
            if (data.password === passVal && data.role === selectedAuthRole) {
                appState.role = selectedAuthRole; 
                appState.user = { 
                    name: data.name || data.nama, 
                    username: userVal, 
                    nim: (selectedAuthRole === 'mahasiswa' ? userVal : ''), 
                    role: selectedAuthRole === 'mahasiswa' ? 'Mahasiswa' : 'Admin Akademik' 
                };
                
                if (selectedAuthRole === 'mahasiswa') appState.selectedMhs = data;
                
                masukKeSistem(false);
            } else {
                showToast("Ditolak", "Password salah atau role tidak sesuai!", "fa-times-circle");
            }
        } else {
            showToast("Tidak Ditemukan", "Akun tidak terdaftar di database Firebase.", "fa-user-slash");
        }
      } catch (error) {
          console.error("Firebase Error:", error);
          showToast("Error Jaringan", "Gagal terhubung ke Firebase.", "fa-wifi");
      }
    }

    function masukKeSistem(isAutoLogin = false) { 
      document.getElementById('nav-user-name').innerText = appState.user.name; document.getElementById('nav-user-role').innerText = appState.user.role; document.getElementById('nav-initial').innerText = appState.user.name.charAt(0); buildSidebarNavigation(); document.getElementById('login-screen').classList.add('hide'); document.getElementById('app-screen').classList.remove('hide'); 
      localStorage.setItem('esurat_fb_user', JSON.stringify(appState.user)); localStorage.setItem('esurat_fb_role', appState.role);
      if(appState.selectedMhs) localStorage.setItem('esurat_fb_mhs', JSON.stringify(appState.selectedMhs));
      
      changeView('dashboard'); 
      if(!isAutoLogin) showToast("Berhasil", `Login Firebase Sukses!`, "fa-bolt text-emerald-500"); 
    }
    
    function handleLogout() { appState.role = null; appState.user = null; localStorage.clear(); document.getElementById('app-screen').classList.add('hide'); document.getElementById('login-screen').classList.remove('hide'); kembaliKePilihanRole(); }

    function buildSidebarNavigation() {
      let nav = `<button onclick="changeView('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition"><i class="fas fa-home text-sm w-4"></i> Dashboard</button>`;
      if(appState.role === 'mahasiswa') { 
          nav += `<button onclick="changeView('riwayat')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition"><i class="fas fa-history text-sm w-4"></i> Riwayat</button>`; 
      } else { 
          nav += `<button onclick="changeView('riwayat')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition"><i class="fas fa-tasks text-sm w-4"></i> Antrean</button>`; 
      }
      document.getElementById('nav-menu').innerHTML = nav;
    }

    function changeView(viewName) {
      appState.currentView = viewName; document.getElementById('view-wrapper').innerHTML = ''; document.getElementById('view-wrapper').appendChild(document.getElementById(`view-${viewName}`).content.cloneNode(true));
      if(window.innerWidth < 768) { const sidebar = document.getElementById('main-sidebar'); if (!sidebar.classList.contains('-translate-x-full')) toggleSidebar(); }
      
      if(viewName === 'dashboard' && appState.role === 'admin') {
          document.getElementById('card-quota').style.display = 'flex';
      }
    }

    function ajukanSuratSpesifik(kode) { showToast("Segera Hadir", "Fase 2: Menghubungkan Form ke Firestore", "fa-info-circle"); }
    function showToast(title, desc, iconClass) { document.getElementById('toast-title').innerText = title; document.getElementById('toast-desc').innerText = desc; document.getElementById('toast-icon-box').innerHTML = `<i class="fas ${iconClass}"></i>`; document.getElementById('app-toast').classList.remove('hide'); setTimeout(() => document.getElementById('app-toast').classList.add('hide'), 3000); }
  </script>
</body>
</html>
