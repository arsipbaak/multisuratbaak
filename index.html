<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.gstatic.com/firebasejs/; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://script.google.com https://*.googleusercontent.com https://www.google.com/recaptcha/ https://*.firebaseio.com https://*.googleapis.com; img-src 'self' data: blob: https://quickchart.io ./logo-poltera.png; frame-src 'self' https://www.google.com/recaptcha/;">
  <title>SIPARTA v8 (Firebase Hybrid)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- FIREBASE SDK COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    .hide { display: none !important; }
  </style>
  <script>tailwind.config = { theme: { extend: { colors: { 'poltera-navy': '#1e3a8a', 'poltera-accent': '#f59e0b', 'poltera-dark': '#0f172a' } } } }</script>
</head>
<body class="text-slate-800">

  <!-- ==================== UI LOGIN ==================== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-poltera-dark via-slate-800 to-poltera-navy p-4">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-30"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-poltera-accent rounded-full mix-blend-multiply filter blur-[100px] opacity-20"></div>

    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center relative z-10">
      <div class="mb-8">
        <center><div class="w-20 h-20 items-center justify-center"><img src="./logo-poltera.png" alt="Logo Poltera" class="w-15 h-15 object-contain"></div></center>
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight uppercase">SIPARTA v8</h1>
        <p class="text-xs font-semibold text-slate-400 mt-1 uppercase tracking-wider">Firebase Staging Area</p>
      </div>

      <div id="role-selection-section" class="space-y-3.5">
        <button onclick="bukaFormKredensial('mahasiswa')" class="w-full flex items-center gap-3.5 p-4 bg-slate-50 hover:bg-blue-50/80 border rounded-xl text-left transition"><div class="w-10 h-10 rounded-lg bg-blue-100 text-poltera-navy flex items-center justify-center text-lg"><i class="fas fa-user-graduate"></i></div><div><p class="font-bold text-sm text-slate-700">Mahasiswa</p><p class="text-[10px] text-slate-400">Masuk ke Dashboard Pribadi</p></div></button>
        <button onclick="bukaFormKredensial('admin')" class="w-full flex items-center gap-3.5 p-4 bg-slate-50 hover:bg-emerald-50 border rounded-xl text-left transition"><div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg"><i class="fas fa-user-shield"></i></div><div><p class="font-bold text-sm text-slate-700">Admin Akademik</p><p class="text-[10px] text-slate-400">Verifikator & TTE</p></div></button>
      </div>

      <div id="credential-form-section" class="hide space-y-4 text-left border p-5 rounded-2xl bg-slate-50/50">
        <button onclick="kembaliKePilihanRole()" class="text-slate-400 hover:text-poltera-navy mb-2"><i class="fas fa-arrow-left"></i> <span class="text-xs font-bold uppercase ml-1">Kembali</span></button>
        <form id="login-auth-form" onsubmit="prosesVerifikasiKredensial(event)">
          <div class="space-y-1 mb-3">
            <label class="block text-[11px] font-bold text-slate-500 uppercase" id="label-field-username">NRP / Username</label>
            <div class="relative"><span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-user text-xs"></i></span><input type="text" id="auth-username" required placeholder="Masukkan ID..." oninput="validasiInput(this)" class="w-full pl-9 pr-4 py-2.5 border rounded-lg text-xs font-semibold"></div>
          </div>
          <div class="space-y-1 mb-4" id="password-field-container">
            <label class="block text-[11px] font-bold text-slate-500 uppercase">Kata Sandi (Password)</label>
            <div class="relative"><span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-lock text-xs"></i></span><input type="password" id="auth-password" required class="w-full pl-9 pr-4 py-2.5 border rounded-lg text-xs font-semibold"></div>
          </div>
          <button type="submit" class="w-full bg-emerald-600 text-white text-xs font-bold py-3 rounded-xl shadow-md"><i class="fas fa-bolt mr-2"></i> Login via Firebase</button>
        </form>
      </div>
    </div>

  <!-- ==================== DASHBOARD & SIDEBAR ==================== -->
  <div id="app-screen" class="hide flex h-screen overflow-hidden relative">
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden transition-opacity opacity-0 backdrop-blur-sm"></div>
    <aside id="main-sidebar" class="w-64 bg-poltera-dark text-slate-200 flex flex-col z-50 shadow-2xl absolute md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
      <button onclick="toggleSidebar()" class="md:hidden absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center"><i class="fas fa-times"></i></button>
      <div class="h-16 flex items-center justify-center gap-3 border-b border-slate-800 bg-slate-900/50"><img src="./logo-poltera.png" alt="Logo Poltera" class="w-9 h-9 object-contain drop-shadow-md"><span class="font-extrabold text-white tracking-widest uppercase text-lg">SIPARTA</span></div>
      <div class="p-4 border-b border-slate-800 bg-slate-950/40 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold" id="nav-initial">U</div><div class="overflow-hidden"><p class="text-xs font-bold text-white truncate" id="nav-user-name">User Name</p><p class="text-[9px] text-slate-400 uppercase tracking-widest font-semibold" id="nav-user-role">Role</p></div></div>
      <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto" id="nav-menu"></nav>
      <div class="p-4 border-t border-slate-800"><button onclick="handleLogout()" class="w-full py-2.5 bg-red-600/10 hover:bg-red-600 text-red-400 hover:text-white rounded-xl text-xs font-bold transition flex justify-center gap-2 items-center"><i class="fas fa-sign-out-alt"></i> Keluar Aplikasi</button></div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden w-full relative">
      <header class="bg-white border-b px-4 md:px-6 py-4 flex justify-between items-center z-10 shadow-sm">
        <div class="flex items-center gap-3"><button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-poltera-navy w-10 h-10 rounded-xl bg-slate-50 border flex items-center justify-center"><i class="fas fa-bars text-lg"></i></button><div><h3 class="text-base md:text-lg font-bold text-slate-800" id="header-title">Dashboard</h3><p class="text-[10px] md:text-xs text-emerald-500 font-bold hidden sm:block"><i class="fas fa-bolt"></i> Firebase Connected</p></div></div>
        <div class="flex items-center gap-3"><span class="text-[10px] md:text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg" id="header-date">Tanggal</span></div>
      </header>
      <div class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50" id="view-wrapper"></div>
    </main>
  </div>

  <!-- VIEWS DASHBOARD -->
  <template id="view-dashboard">
    <div class="space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-blue-50 text-poltera-navy flex items-center justify-center text-lg"><i class="fas fa-file-invoice"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Total Pengajuan</p><p class="text-xl font-bold text-slate-800" id="stat-total">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fas fa-spinner fa-spin"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Menunggu Verif</p><p class="text-xl font-bold text-slate-800" id="stat-pending">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fas fa-check-circle"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Disetujui</p><p class="text-xl font-bold text-slate-800" id="stat-done">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fas fa-times-circle"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Ditolak</p><p class="text-xl font-bold text-slate-800" id="stat-reject">0</p></div></div>
        <div class="bg-white p-4 rounded-2xl border flex items-center gap-4" id="card-quota" style="display: none;"><div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg"><i class="fas fa-server"></i></div><div><p class="text-[10px] font-semibold text-slate-400">Status Server</p><p class="text-sm font-bold text-slate-800 mt-1" id="stat-quota">Firebase</p></div></div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
        <div onclick="ajukanSuratSpesifik('1')" class="p-5 bg-white rounded-2xl border shadow-sm border-l-4 border-l-blue-500 hover:shadow-md transition cursor-pointer group"><h5 class="font-extrabold text-slate-800 text-sm mb-2 group-hover:text-poltera-navy transition"><i class="fas fa-file-alt text-blue-500 mr-1.5"></i> Surat Keterangan Aktif</h5><p class="text-[11px] text-slate-500 leading-relaxed">Klik untuk mengajukan.</p></div>
        <div onclick="ajukanSuratSpesifik('2')" class="p-5 bg-white rounded-2xl border shadow-sm border-l-4 border-l-emerald-500 hover:shadow-md transition cursor-pointer group"><h5 class="font-extrabold text-slate-800 text-sm mb-2 group-hover:text-poltera-navy transition"><i class="fas fa-file-signature text-emerald-500 mr-1.5"></i> Surat Keterangan</h5><p class="text-[11px] text-slate-500 leading-relaxed">Klik untuk mengajukan.</p></div>
        <div onclick="ajukanSuratSpesifik('3')" class="p-5 bg-white rounded-2xl border shadow-sm border-l-4 border-l-amber-500 hover:shadow-md transition cursor-pointer group"><h5 class="font-extrabold text-slate-800 text-sm mb-2 group-hover:text-poltera-navy transition"><i class="fas fa-briefcase text-amber-500 mr-1.5"></i> Surat Pengantar OJT</h5><p class="text-[11px] text-slate-500 leading-relaxed">Klik untuk mengajukan.</p></div>
      </div>
    </div>
  </template>

  <!-- ================= FITUR: FORM PENGAJUAN ================= -->
  <template id="view-pengajuan">
    <div class="bg-white rounded-2xl border shadow-sm p-4 md:p-6">
      <h4 class="font-bold text-lg mb-4 text-slate-800"><i class="fas fa-paper-plane text-poltera-navy mr-2"></i> Form Pengajuan Surat</h4>
      <form onsubmit="doSubmitPermohonan(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">NRP</label><input type="text" id="mhs-nim" readonly class="w-full p-2.5 border rounded-lg bg-slate-50 text-slate-500 text-sm"></div>
          <div><label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nama Lengkap</label><input type="text" id="mhs-nama" readonly class="w-full p-2.5 border rounded-lg bg-slate-50 text-slate-500 text-sm"></div>
          <div><label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Program Studi</label><input type="text" id="mhs-prodi" readonly class="w-full p-2.5 border rounded-lg bg-slate-50 text-slate-500 text-sm"></div>
          <div><label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nomor WhatsApp Aktif</label><input type="text" id="mhs-hp" required class="w-full p-2.5 border rounded-lg text-sm focus:border-poltera-navy focus:ring-1 focus:ring-poltera-navy" placeholder="08123456789"></div>
        </div>
        
        <div class="border-t pt-4">
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Jenis Surat</label>
          <select id="mhs-jenis-surat" onchange="toggleFormDinamis()" required class="w-full p-2.5 border rounded-lg text-sm font-bold text-poltera-navy focus:border-poltera-navy focus:ring-1 focus:ring-poltera-navy"></select>
        </div>

        <div id="form-group-keperluan" class="hide bg-slate-50 p-4 rounded-xl border">
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tujuan / Keperluan</label>
          <select id="mhs-keperluan" onchange="toggleKeperluanLainnya()" class="w-full p-2.5 border rounded-lg text-sm bg-white"></select>
          <input type="text" id="mhs-keperluan-text" class="w-full p-2.5 border rounded-lg text-sm mt-3 hide" placeholder="Ketik keperluan secara rinci...">
        </div>

        <div class="pt-4 flex justify-end gap-3">
           <button type="button" onclick="changeView('dashboard')" class="px-5 py-2.5 rounded-xl border text-slate-500 text-xs font-bold hover:bg-slate-50 transition">Batal</button>
           <button type="submit" class="px-5 py-2.5 rounded-xl bg-poltera-navy text-white text-xs font-bold shadow-md hover:bg-blue-800 transition"><i class="fas fa-bolt mr-2"></i> Kirim Seketika</button>
        </div>
      </form>
    </div>
  </template>

  <!-- ================= FITUR: DAFTAR ANTREAN REAL-TIME ================= -->
  <template id="view-riwayat">
    <div class="bg-white rounded-2xl border shadow-sm flex flex-col h-full max-h-[85vh]">
      <div class="p-4 border-b flex flex-col md:flex-row justify-between items-center bg-slate-50 gap-3">
          <h4 class="font-bold text-sm shrink-0"><i class="fas fa-bolt text-emerald-500 mr-2"></i>Antrean Surat Real-Time</h4>
      </div>
      <div class="overflow-x-auto flex-1">
          <table class="w-full text-left border-collapse min-w-[800px]"><thead class="bg-slate-100 text-slate-500 text-[10px] font-extrabold uppercase border-b sticky top-0 z-10"><tr><th class="p-3">Waktu</th><th class="p-3">No Surat / ID</th><th class="p-3">Mahasiswa</th><th class="p-3">Jenis</th><th class="p-3 text-center">Status</th><th class="p-3 text-center">Tindakan</th></tr></thead><tbody class="text-xs divide-y divide-slate-100" id="fb-table-body"><tr><td colspan="6" class="p-8 text-center"><i class="fas fa-spinner fa-spin mr-2"></i> Menghubungkan ke Firestore...</td></tr></tbody></table>
      </div>
    </div>
  </template>

  <!-- ================= MODAL ALASAN PENOLAKAN ================= -->
  <div id="reject-modal" class="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center backdrop-blur-sm hide">
    <div class="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl transform transition-all border-t-4 border-rose-500">
      <h3 class="text-lg font-extrabold text-slate-800 mb-1"><i class="fas fa-exclamation-circle text-rose-500 mr-2"></i> Tolak Dokumen</h3>
      <p class="text-[11px] font-semibold text-slate-500 mb-4 leading-relaxed">Berikan alasan penolakan. Pesan ini langsung dikirim ke WhatsApp mahasiswa bersangkutan.</p>
      <textarea id="reject-reason" rows="3" class="w-full p-3 border rounded-xl text-sm mb-5 focus:border-rose-500 focus:ring-1 focus:ring-rose-500" placeholder="Contoh: Tanda tangan belum lengkap..."></textarea>
      <div class="flex justify-end gap-3">
        <button onclick="closeRejectModal()" class="px-4 py-2.5 rounded-xl font-bold text-slate-500 border hover:bg-slate-50 text-xs transition">Batal</button>
        <button onclick="submitRejectForm()" class="px-4 py-2.5 rounded-xl font-bold bg-rose-600 text-white shadow-md hover:bg-rose-700 text-xs transition"><i class="fas fa-paper-plane mr-2"></i> Kirim Penolakan</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="app-toast" class="fixed bottom-5 right-5 left-5 md:left-auto bg-white border-l-4 border-slate-900 shadow-2xl rounded-xl px-5 py-4 hide flex items-center gap-3.5 z-50 transition-all"><div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm shrink-0" id="toast-icon-box"></div><div><h5 class="font-bold text-xs" id="toast-title">Notifikasi</h5><p class="text-[10px] text-slate-500" id="toast-desc">Memproses...</p></div></div>

  <script>
    // -------------------------------------------------------------
    // INISIALISASI FIREBASE & GAS MICROSERVICE
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBLMONLXydW3nqBKnbVh7y6IoeeCXkMveA",
      authDomain: "siparta-poltera.firebaseapp.com",
      projectId: "siparta-poltera",
      storageBucket: "siparta-poltera.firebasestorage.app",
      messagingSenderId: "1019784565445",
      appId: "1:1019784565445:web:4d01687606461ef0e456ac",
      measurementId: "G-5R258DP34L"
    };

    // PASTIKAN INI ADALAH URL DEPLOY BARU JIKA ADA ERROR CETAK PDF
    const GAS_MICROSERVICE_URL = "https://script.google.com/macros/s/AKfycbxJbTFcvIVLjiqqgVX83RGcI1hLm5uW2Nq9YzLEb69kVwLvYGR_Fx75fvpAd1KSVQfpDg/exec";
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // -------------------------------------------------------------

    let appState = { role: null, user: null, currentView: 'dashboard', selectedMhs: null, pendingSuratCode: null };
    let unsubscribeRiwayat = null; 
    
    const MASTER_JENIS = [ {id: "1", nama: "Surat Keterangan Aktif"}, {id: "2", nama: "Surat Keterangan"}, {id: "3", nama: "Surat Pengantar OJT"}, {id: "4", nama: "Monitoring Beasiswa"}, {id: "5", nama: "Keterangan Lulus (SKL)"} ];
    const MASTER_KEPERLUAN = ["Tunjangan Gaji Orang Tua", "Persyaratan Beasiswa", "Pembuatan Rekening Bank", "Kehilangan KTM", "Persyaratan Magang / OJT"];

    function validasiInput(input) { if (selectedAuthRole === 'mahasiswa') input.value = input.value.replace(/[^0-9]/g, ''); }
    function toggleSidebar() { const sidebar = document.getElementById('main-sidebar'); const overlay = document.getElementById('sidebar-overlay'); if (sidebar.classList.contains('-translate-x-full')) { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); setTimeout(() => overlay.classList.remove('opacity-0'), 10); } else { sidebar.classList.add('-translate-x-full'); overlay.classList.add('opacity-0'); setTimeout(() => overlay.classList.add('hidden'), 300); } }

    window.onload = function() {
      document.getElementById('header-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const savedUser = localStorage.getItem('esurat_fb_user'); const savedRole = localStorage.getItem('esurat_fb_role');
      if(savedUser && savedRole) { 
          appState.user = JSON.parse(savedUser); appState.role = savedRole; 
          const savedMhs = localStorage.getItem('esurat_fb_mhs'); if(savedMhs) appState.selectedMhs = JSON.parse(savedMhs); 
          document.getElementById('role-selection-section').classList.add('hide'); masukKeSistem(true); 
      }
    };

    let selectedAuthRole = '';
    function bukaFormKredensial(role) {
      selectedAuthRole = role; document.getElementById('role-selection-section').classList.add('hide'); document.getElementById('credential-form-section').classList.remove('hide');
      const label = document.getElementById('label-field-username'); const input = document.getElementById('auth-username'); const passInput = document.getElementById('auth-password');
      if (role === 'mahasiswa') { label.innerText = "NRP Anda"; input.placeholder = "Contoh: 331120000"; passInput.placeholder = "Password NRP"; } 
      else { label.innerText = "Username Admin"; input.placeholder = "admin"; passInput.placeholder = "Password Admin"; }
    }
    function kembaliKePilihanRole() { document.getElementById('credential-form-section').classList.add('hide'); document.getElementById('role-selection-section').classList.remove('hide'); }

    async function prosesVerifikasiKredensial(event) {
      event.preventDefault(); 
      const userVal = document.getElementById('auth-username').value.trim(); const passVal = document.getElementById('auth-password').value; 
      showToast("Memeriksa Database...", "Menghubungkan ke Firestore", "fa-spinner fa-spin");
      try {
        let docRef = (selectedAuthRole === 'admin') ? db.collection('users').doc('admin_baak') : db.collection('users').doc(userVal);
        const doc = await docRef.get();
        if (doc.exists) {
            const data = doc.data();
            if (data.password === passVal && data.role === selectedAuthRole) {
                appState.role = selectedAuthRole; 
                appState.user = { name: data.name || data.nama, username: userVal, nim: (selectedAuthRole === 'mahasiswa' ? userVal : ''), role: selectedAuthRole === 'mahasiswa' ? 'Mahasiswa' : 'Admin Akademik' };
                if (selectedAuthRole === 'mahasiswa') appState.selectedMhs = data;
                masukKeSistem(false);
            } else { showToast("Ditolak", "Password salah atau role tidak sesuai!", "fa-times-circle"); }
        } else { showToast("Tidak Ditemukan", "Akun tidak terdaftar di database Firebase.", "fa-user-slash"); }
      } catch (error) { showToast("Error Jaringan", "Gagal terhubung ke Firebase.", "fa-wifi"); }
    }

    function masukKeSistem(isAutoLogin = false) { 
      document.getElementById('nav-user-name').innerText = appState.user.name; document.getElementById('nav-user-role').innerText = appState.user.role; document.getElementById('nav-initial').innerText = appState.user.name.charAt(0); buildSidebarNavigation(); document.getElementById('login-screen').classList.add('hide'); document.getElementById('app-screen').classList.remove('hide'); 
      localStorage.setItem('esurat_fb_user', JSON.stringify(appState.user)); localStorage.setItem('esurat_fb_role', appState.role);
      if(appState.selectedMhs) localStorage.setItem('esurat_fb_mhs', JSON.stringify(appState.selectedMhs));
      changeView('dashboard'); if(!isAutoLogin) showToast("Berhasil", `Login Firebase Sukses!`, "fa-bolt text-emerald-500"); 
    }
    
    function handleLogout() { 
        if(unsubscribeRiwayat) { unsubscribeRiwayat(); unsubscribeRiwayat = null; } 
        appState.role = null; appState.user = null; localStorage.clear(); document.getElementById('app-screen').classList.add('hide'); document.getElementById('login-screen').classList.remove('hide'); kembaliKePilihanRole(); 
    }

    function buildSidebarNavigation() {
      let nav = `<button onclick="changeView('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition"><i class="fas fa-home text-sm w-4"></i> Dashboard</button>`;
      if(appState.role === 'mahasiswa') { 
          nav += `<button onclick="changeView('pengajuan')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition"><i class="fas fa-edit text-sm w-4"></i> Ajukan Surat</button><button onclick="changeView('riwayat')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition"><i class="fas fa-history text-sm w-4"></i> Riwayat</button>`; 
      } else { 
          nav += `<button onclick="changeView('riwayat')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition"><i class="fas fa-tasks text-sm w-4"></i> Antrean Firebase</button>`; 
      }
      document.getElementById('nav-menu').innerHTML = nav;
    }

    function ajukanSuratSpesifik(kode) {
        if (appState.role !== 'mahasiswa') { showToast("Informasi", "Hanya Mahasiswa yang dapat membuat pengajuan.", "fa-info-circle"); return; }
        appState.pendingSuratCode = kode; changeView('pengajuan');
    }

    function changeView(viewName) {
      appState.currentView = viewName; 
      document.getElementById('view-wrapper').innerHTML = ''; 
      document.getElementById('view-wrapper').appendChild(document.getElementById(`view-${viewName}`).content.cloneNode(true));
      if(window.innerWidth < 768) { const sidebar = document.getElementById('main-sidebar'); if (!sidebar.classList.contains('-translate-x-full')) toggleSidebar(); }
      
      if(viewName === 'dashboard' && appState.role === 'admin') { document.getElementById('card-quota').style.display = 'flex'; }
      else if(viewName === 'pengajuan') { setupFormPengajuan(); }
      else if(viewName === 'riwayat') { listenToRiwayatFirestore(); }
    }

    // =========================================================================
    // FASE 2: FIRESTORE PENGAJUAN (MAHASISWA)
    // =========================================================================
    function setupFormPengajuan() {
        if(appState.selectedMhs) {
          document.getElementById('mhs-nama').value = appState.selectedMhs.nama || ""; 
          document.getElementById('mhs-nim').value = appState.selectedMhs.nim || ""; 
          document.getElementById('mhs-prodi').value = appState.selectedMhs.prodi || ""; 
        }
        let optSurat = `<option value="">-- Pilih Jenis Surat --</option>`; MASTER_JENIS.forEach(s => optSurat += `<option value="${s.id}">${s.nama}</option>`); document.getElementById('mhs-jenis-surat').innerHTML = optSurat;
        let optKep = `<option value="">-- Pilih Keperluan --</option>`; MASTER_KEPERLUAN.forEach(k => optKep += `<option value="${k}">${k}</option>`); optKep += `<option value="LAINNYA" class="font-bold bg-slate-100">Lainnya (Ketik Manual)</option>`; document.getElementById('mhs-keperluan').innerHTML = optKep;
        if (appState.pendingSuratCode) { document.getElementById('mhs-jenis-surat').value = appState.pendingSuratCode; toggleFormDinamis(); appState.pendingSuratCode = null; }
    }

    async function doSubmitPermohonan(e) {
      e.preventDefault(); 
      const jenisSurat = document.getElementById('mhs-jenis-surat').value;
      let keperluanVal = document.getElementById('mhs-keperluan').value; 
      if (keperluanVal === 'LAINNYA') keperluanVal = document.getElementById('mhs-keperluan-text').value;

      const payload = {
        nim: appState.selectedMhs.nim,
        nama: appState.selectedMhs.nama,
        prodi: appState.selectedMhs.prodi,
        kode_surat: jenisSurat,
        tujuan: keperluanVal || "-",
        no_hp: document.getElementById('mhs-hp').value || "-",
        status: "Menunggu Verifikasi",
        no_surat: "-",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      showToast("Menyimpan", "Mengirim ke Firestore...", "fa-spinner fa-spin");
      try { 
          await db.collection("pengajuan").add(payload); 
          showToast("Sukses", "Terkirim secepat kilat!", "fa-bolt text-emerald-500"); 
          changeView('riwayat'); 
      } catch(e) { showToast("Gagal", e.message, "fa-times"); }
    }

    // =========================================================================
    // FASE 2.5: LISTENER REAL-TIME (SEKARANG DILENGKAPI TOMBOL DOWNLOAD)
    // =========================================================================
    function listenToRiwayatFirestore() {
        if(unsubscribeRiwayat) unsubscribeRiwayat(); 
        
        let query = db.collection("pengajuan").orderBy("createdAt", "desc");
        if(appState.role === 'mahasiswa') { query = query.where("nim", "==", appState.user.nim); }

        unsubscribeRiwayat = query.onSnapshot((snapshot) => {
            const container = document.getElementById('fb-table-body');
            if(!container) return; 
            
            if (snapshot.empty) { container.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada pengajuan.</td></tr>`; updateStats(0,0,0,0); return; }
            
            let markup = ''; let t_tot = 0, t_pend = 0, t_done = 0, t_rej = 0;

            snapshot.forEach((doc) => {
                const d = doc.data(); t_tot++;
                if(d.status === "Menunggu Verifikasi") t_pend++; else if(d.status === "Selesai") t_done++; else t_rej++;
                
                let badge = d.status === "Selesai" ? `<span class="px-2 py-1 bg-emerald-50 text-emerald-600 rounded-full font-bold">Disetujui</span>` : d.status === "Ditolak" ? `<span class="px-2 py-1 bg-rose-50 text-rose-600 rounded-full font-bold">Ditolak</span>` : `<span class="px-2 py-1 bg-amber-50 text-amber-600 rounded-full font-bold animate-pulse">Menunggu</span>`; 
                let timeStr = d.createdAt ? new Date(d.createdAt.toDate()).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : "Baru Saja";
                let jenisStr = MASTER_JENIS.find(x => x.id === d.kode_surat)?.nama || "Surat Lain";

                let actionBtn = `<div class="flex gap-1 justify-center">`;
                
                if(d.status === "Selesai" && d.link_pdf) {
                    actionBtn += `<a href="${d.link_pdf}" target="_blank" class="bg-blue-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700 transition" title="Unduh PDF"><i class="fas fa-download"></i></a>`;
                } else if(appState.role === 'admin' && d.status === "Menunggu Verifikasi") {
                    actionBtn += `<button onclick="approveFirebase('${doc.id}')" class="bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-700 transition"><i class="fas fa-check"></i></button>`;
                    actionBtn += `<button onclick="openRejectModal('${doc.id}')" class="bg-rose-50 text-rose-600 border border-rose-100 px-2.5 py-1.5 rounded-lg text-xs font-bold hover:bg-rose-100 transition"><i class="fas fa-times"></i></button>`;
                }
                actionBtn += `</div>`;

                markup += `<tr class="border-b hover:bg-slate-50"><td class="p-3 font-semibold text-[10px]">${timeStr}</td><td class="p-3 font-mono text-[10px] font-bold text-slate-400">${d.no_surat || doc.id.substring(0,6)}</td><td class="p-3"><div><p class="font-bold text-slate-800">${d.nama}</p><p class="text-[10px] font-mono">${d.nim}</p></div></td><td class="p-3 text-[11px] font-bold text-poltera-navy">${jenisStr}</td><td class="p-3 text-center">${badge}</td><td class="p-3 text-center">${actionBtn}</td></tr>`;
            });
            container.innerHTML = markup;
            updateStats(t_tot, t_pend, t_done, t_rej);
        });
    }

    // =====================================================================
    // FASE 3: FUNGSI ADMIN HYBRID (GAS + Firebase)
    // =====================================================================
    async function approveFirebase(docId) {
        showToast("Mencetak PDF...", "Mengirim instruksi ke Microservice", "fa-spinner fa-spin");
        try {
            const doc = await db.collection("pengajuan").doc(docId).get();
            const data = doc.data();

            const payloadData = {
                nim: data.nim, nama: data.nama, prodi: data.prodi, kode_surat: data.kode_surat, 
                no_hp: data.no_hp, tujuan: data.tujuan, semester: data.semester || "-", 
                tahun_akademik: data.tahun_akademik || "-", ortu_nama: data.ortu_nama || "-", 
                ortu_nip: data.ortu_nip || "-", ortu_pangkat: data.ortu_pangkat || "-", 
                ortu_instansi: data.ortu_instansi || "-", umum_ttl: data.umum_ttl || "-", 
                umum_alamat: data.umum_alamat || "-", umum_ipk: data.umum_ipk || "-", 
                tujuan_pt: data.tujuan_pt || "-", alamat_pt: data.alamat_pt || "-", 
                lama_ojt: data.lama_ojt || "-", rentang_ojt: data.rentang_ojt || "-"
            };

            const form = new URLSearchParams();
            form.append('action', 'cetakDokumen');
            form.append('data', JSON.stringify(payloadData));

            const res = await fetch(GAS_MICROSERVICE_URL, { method: 'POST', body: form }).then(r => r.json());

            if (res.status === 'success') {
                await db.collection("pengajuan").doc(docId).update({ 
                    status: "Selesai", 
                    no_surat: res.no_surat,
                    link_pdf: res.link_pdf
                });
                showToast("Sukses!", "PDF jadi & Surat Disetujui!", "fa-bolt text-emerald-500");
            } else { showToast("Gagal Cetak", res.message, "fa-times"); }
        } catch(e) { showToast("Error Jaringan", "Gagal menghubungi Microservice.", "fa-wifi"); }
    }

    let rejectTargetId = null;
    function openRejectModal(id) { rejectTargetId = id; document.getElementById('reject-modal').classList.remove('hide'); }
    function closeRejectModal() { rejectTargetId = null; document.getElementById('reject-modal').classList.add('hide'); }
    
    async function submitRejectForm() {
        const alasan = document.getElementById('reject-reason').value.trim();
        if(!alasan) return alert("Isi alasan penolakan!");
        
        showToast("Menolak...", "Mengirim Notifikasi WA", "fa-spinner fa-spin");
        try {
            const doc = await db.collection("pengajuan").doc(rejectTargetId).get();
            const form = new URLSearchParams();
            form.append('action', 'notifTolak');
            form.append('data', JSON.stringify({ no_hp: doc.data().no_hp, alasan: alasan }));
            
            await fetch(GAS_MICROSERVICE_URL, { method: 'POST', body: form });
            await db.collection("pengajuan").doc(rejectTargetId).update({ status: "Ditolak", alasan_tolak: alasan });
            
            showToast("Ditolak", "Surat ditolak & Mahasiswa telah di-WA.", "fa-check");
            closeRejectModal();
        } catch(e) { showToast("Error", "Gagal menolak dokumen.", "fa-wifi"); }
    }

    // =====================================================================
    // UTILITY
    // =====================================================================
    function updateStats(tot, pend, done, rej) {
        if(document.getElementById('stat-total')) document.getElementById('stat-total').innerText = tot;
        if(document.getElementById('stat-pending')) document.getElementById('stat-pending').innerText = pend;
        if(document.getElementById('stat-done')) document.getElementById('stat-done').innerText = done;
        if(document.getElementById('stat-reject')) document.getElementById('stat-reject').innerText = rej;
    }

    function toggleFormDinamis() {
      const jenisVal = document.getElementById('mhs-jenis-surat').value;
      const grpKep = document.getElementById('form-group-keperluan');
      if(grpKep) grpKep.style.display = 'none';
      if (jenisVal === '1' || jenisVal === '2') { if(grpKep) grpKep.style.display = 'block'; } 
    }
    function toggleKeperluanLainnya() { const val = document.getElementById('mhs-keperluan').value; const textInput = document.getElementById('mhs-keperluan-text'); if(val === 'LAINNYA') { textInput.classList.remove('hide'); } else { textInput.classList.add('hide'); } }
    function showToast(title, desc, iconClass) { document.getElementById('toast-title').innerText = title; document.getElementById('toast-desc').innerText = desc; document.getElementById('toast-icon-box').innerHTML = `<i class="fas ${iconClass}"></i>`; document.getElementById('app-toast').classList.remove('hide'); setTimeout(() => document.getElementById('app-toast').classList.add('hide'), 3000); }
  </script>
</body>
